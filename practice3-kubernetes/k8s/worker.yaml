apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: uptime-monitor
spec:
  selector:
    app: worker
  ports:
    - port: 8001
      targetPort: 8001
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: uptime-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: uptime-worker:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8001
        env:
        - name: DATABASE_URL
          value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
        - name: API_GATEWAY_URL
          valueFrom:
            configMapKeyRef:
              name: uptime-config
              key: API_GATEWAY_URL
        - name: CHECK_INTERVAL_SECONDS
          valueFrom:
            configMapKeyRef:
              name: uptime-config
              key: CHECK_INTERVAL_SECONDS
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: uptime-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: uptime-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: uptime-secret
              key: POSTGRES_DB
